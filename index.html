<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Time Anchor</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #00ffcc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #title {
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        #clock {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        #description {
            margin-top: 20px;
            font-size: 0.9rem;
            max-width: 600px;
            line-height: 1.6;
            opacity: 0.6;
        }
        @media (max-width: 600px) {
            #clock { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="title">Global Time Anchor</div>
    <div id="clock">00:00:00.000000</div>
    <div id="description"></div>

    <script>
        const translations = {
            tr: {
                title: "KÜRESEL ZAMAN ÇAPASI",
                desc: "Tüm dünya başkentlerinin saatlerinin aritmetik ortalamasıdır."
            },
            en: {
                title: "GLOBAL TIME ANCHOR",
                desc: "The arithmetic mean of the times of all world capitals."
            },
            de: {
                title: "GLOBALER ZEITANKER",
                desc: "Das arithmetische Mittel der Zeiten aller Welthauptstädte."
            },
            fr: {
                title: "ANCRE TEMPORELLE MONDIALE",
                desc: "La moyenne arithmétique des heures de toutes les capitales du monde."
            }
        };

        // Dil belirleme
        const userLang = navigator.language.split('-')[0];
        const content = translations[userLang] || translations.en;
        
        document.getElementById('title').innerText = content.title;
        document.getElementById('description').innerText = content.desc;

        // Dünya başkentlerinin ortalama UTC farkı (Yaklaşık sabit değer)
        // Matematiksel olarak tüm boylamların ortalaması alındığında 
        // global bir sabit kayma elde edilir.
        const AVERAGE_CAPITAL_OFFSET_MS = 2.8 * 60 * 60 * 1000; 

        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const anchorTime = new Date(utc + AVERAGE_CAPITAL_OFFSET_MS);

            const hours = String(anchorTime.getHours()).padStart(2, '0');
            const minutes = String(anchorTime.getMinutes()).padStart(2, '0');
            const seconds = String(anchorTime.getSeconds()).padStart(2, '0');
            const ms = String(anchorTime.getMilliseconds()).padStart(3, '0');
            
            // Mikrosaniye simülasyonu (Yüksek çözünürlüklü zamanlayıcı)
            const micro = String(Math.floor(performance.now() * 1000) % 1000).padStart(3, '0');

            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}.${ms}${micro}`;
            
            requestAnimationFrame(updateClock);
        }

        updateClock();
    </script>
</body>
</html>
